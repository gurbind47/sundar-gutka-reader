<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1510" id="metaThemeColor" />
  <meta name="description" content="Sundar Gutka (Damdami Taksal) — auto-scroll path reader for phone, tablet, and desktop." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sundar Gutka" />
  <title>Sundar Gutka · Damdami Taksal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=5" />
  <script>
    /* Apply theme before paint to avoid flash */
    (function () {
      try {
        var raw = localStorage.getItem("sundar-gutka-reader-v2");
        var pref = "system";
        if (raw) {
          var d = JSON.parse(raw);
          if (d.theme === "day" || d.theme === "night" || d.theme === "system") pref = d.theme;
        }
        document.documentElement.setAttribute("data-theme", pref);
        var night =
          pref === "night" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (pref === "day") night = false;
        if (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) night = false;
        document.documentElement.setAttribute("data-resolved", night ? "night" : "day");
      } catch (e) {}
      /* Drop stale offline caches from older builds */
      try {
        if ("caches" in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              if (k.indexOf("sundar-gutka-") === 0 && k !== "sundar-gutka-v5") {
                caches.delete(k);
              }
            });
          });
        }
      } catch (e2) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="toolbar" id="toolbar" role="toolbar" aria-label="Reader controls">
      <div class="toolbar-left">
        <button type="button" id="btnPlay" class="btn btn-primary" aria-pressed="false" title="Play / Pause (Space)">
          <span class="icon" id="playIcon" aria-hidden="true">▶</span>
          <span class="btn-label" id="playLabel">Play</span>
        </button>
        <button type="button" id="btnBanis" class="btn btn-secondary" aria-expanded="false" aria-controls="banisDrawer" title="Banis menu (B)">
          <span class="btn-label">Banis</span>
        </button>
        <button type="button" id="btnSearch" class="btn btn-secondary" aria-expanded="false" aria-controls="searchPanel" title="Search (F)">
          <span class="btn-label">Search</span>
        </button>
      </div>

      <div class="toolbar-center">
        <label class="speed-control" for="speedSlider">
          <span class="control-label">Speed</span>
          <input
            type="range"
            id="speedSlider"
            min="1"
            max="10"
            step="1"
            value="3"
            aria-valuemin="1"
            aria-valuemax="10"
            aria-valuenow="3"
          />
          <span class="speed-value" id="speedValue">3</span>
        </label>

        <div class="zoom-control" role="group" aria-label="Text size">
          <span class="control-label">Size</span>
          <button type="button" id="btnZoomOut" class="btn btn-secondary btn-compact" title="Smaller text (−)">−</button>
          <span class="zoom-value" id="zoomValue">100%</span>
          <button type="button" id="btnZoomIn" class="btn btn-secondary btn-compact" title="Larger text (+)">+</button>
        </div>
      </div>

      <div class="toolbar-right">
        <button type="button" id="btnMode" class="btn btn-secondary btn-compact" title="PDF / Text mode (M)" aria-label="Toggle reading mode">
          <span class="btn-label" id="modeLabel">PDF</span>
        </button>
        <button type="button" id="btnTheme" class="btn btn-secondary btn-compact" title="Theme: System / Day / Night" aria-label="Toggle theme">
          <span id="themeIcon" aria-hidden="true">◐</span>
          <span class="btn-label" id="themeLabel">Auto</span>
        </button>
        <label class="page-control" for="pageInput">
          <span class="control-label">Page</span>
          <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" />
          <span class="page-total" id="pageTotal">/ —</span>
        </label>
        <button type="button" id="btnGo" class="btn btn-secondary" title="Go to page">Go</button>
      </div>
    </header>

    <main id="viewer" class="viewer" tabindex="0" aria-label="Sundar Gutka pages">
      <div id="status" class="status" role="status">Loading Sundar Gutka…</div>
      <div id="pages" class="pages"></div>
      <div id="textReader" class="text-reader hidden" aria-hidden="true"></div>
    </main>
  </div>

  <!-- Banis drawer -->
  <div id="banisBackdrop" class="banis-backdrop" hidden></div>
  <aside id="banisDrawer" class="banis-drawer" aria-hidden="true" aria-label="Banis table of contents" inert>
    <div class="banis-header">
      <h2>Banis</h2>
      <button type="button" id="btnCloseBanis" class="btn btn-secondary btn-icon" title="Close" aria-label="Close banis menu">✕</button>
    </div>
    <div id="banisList" class="banis-list" role="list"></div>
  </aside>

  <!-- Search panel -->
  <div id="searchBackdrop" class="search-backdrop" hidden></div>
  <section id="searchPanel" class="search-panel" aria-hidden="true" aria-label="Search" inert>
    <div class="search-header">
      <h2>Search</h2>
      <button type="button" id="btnCloseSearch" class="btn btn-secondary btn-icon" title="Close" aria-label="Close search">✕</button>
    </div>
    <form id="searchForm" class="search-form" autocomplete="off">
      <label class="search-input-wrap" for="searchInput">
        <span class="visually-hidden">Search Gurbani</span>
        <input type="search" id="searchInput" placeholder="Search Gurmukhi or English letters…" enterkeyhint="search" />
      </label>
      <button type="submit" class="btn btn-primary" id="btnDoSearch">Find</button>
    </form>
    <p id="searchStatus" class="search-status" role="status"></p>
    <div id="searchResults" class="search-results" role="list"></div>
  </section>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
