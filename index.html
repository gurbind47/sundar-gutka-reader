<!DOCTYPE html>
<html lang="en" data-theme="system" data-mode="scroll" data-controls="shown">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1510" id="metaThemeColor" />
  <meta name="description" content="Sundar Gutka (Damdami Taksal) — auto-scroll path reader for phone, tablet, and desktop." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sundar Gutka" />
  <title>Sundar Gutka · Damdami Taksal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css?v=11" />
  <script>
    /* Apply theme before paint to avoid flash */
    (function () {
      try {
        var raw = localStorage.getItem("sundar-gutka-reader-v2");
        var pref = "system";
        var mode = "scroll";
        var hidden = false;
        if (raw) {
          var d = JSON.parse(raw);
          if (d.theme === "day" || d.theme === "night" || d.theme === "system") pref = d.theme;
          if (d.mode === "book" || d.mode === "kindle") mode = d.mode;
          hidden = d.controlsHidden === true;
        }
        document.documentElement.setAttribute("data-theme", pref);
        document.documentElement.setAttribute("data-mode", mode);
        document.documentElement.setAttribute("data-controls", hidden ? "hidden" : "shown");
        var night =
          pref === "night" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (pref === "day") night = false;
        if (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) night = false;
        document.documentElement.setAttribute("data-resolved", night ? "night" : "day");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="toolbar" id="toolbar" role="toolbar" aria-label="Reader controls">
      <div class="toolbar-main">
        <button type="button" id="btnPlay" class="btn btn-primary" aria-pressed="false" title="Play / Pause (Space)">
          <span class="icon" id="playIcon" aria-hidden="true">▶</span>
          <span class="btn-label" id="playLabel">Play</span>
        </button>
        <button type="button" id="btnBanis" class="btn btn-secondary" aria-expanded="false" aria-controls="banisDrawer" title="Banis menu (B)">
          <span class="btn-label">Bani</span>
        </button>

        <label class="speed-control" for="speedSlider">
          <span class="control-label">Speed</span>
          <input
            type="range"
            id="speedSlider"
            min="1"
            max="5"
            step="1"
            value="3"
            aria-valuemin="1"
            aria-valuemax="5"
            aria-valuenow="3"
          />
          <span class="speed-value" id="speedValue">3</span>
        </label>

        <button type="button" id="btnMode" class="btn btn-secondary btn-compact" title="Reading mode: Scroll / Book / Kindle (M)" aria-label="Reading mode">
          <span id="modeIcon" aria-hidden="true">☰</span>
          <span class="btn-label" id="modeLabel">Scroll</span>
        </button>

        <button type="button" id="btnMore" class="btn btn-secondary btn-compact" aria-expanded="false" aria-controls="toolbarExtra" title="More controls">
          <span class="btn-label" id="moreLabel">More</span>
        </button>
      </div>

      <div class="toolbar-extra" id="toolbarExtra" hidden>
        <div class="zoom-control" role="group" aria-label="Text size">
          <span class="control-label">Size</span>
          <button type="button" id="btnZoomOut" class="btn btn-secondary btn-compact" title="Smaller text (−)">−</button>
          <span class="zoom-value" id="zoomValue">100%</span>
          <button type="button" id="btnZoomIn" class="btn btn-secondary btn-compact" title="Larger text (+)">+</button>
        </div>

        <button type="button" id="btnTheme" class="btn btn-secondary btn-compact" title="Theme: System / Day / Night" aria-label="Toggle theme">
          <span id="themeIcon" aria-hidden="true">◐</span>
          <span class="btn-label" id="themeLabel">Auto</span>
        </button>

        <label class="page-control" for="pageInput">
          <span class="control-label">Page</span>
          <input type="number" id="pageInput" min="1" value="1" inputmode="numeric" />
          <span class="page-total" id="pageTotal">/ —</span>
        </label>
        <button type="button" id="btnGo" class="btn btn-secondary" title="Go to page">Go</button>

        <button type="button" id="btnFull" class="btn btn-secondary btn-compact" title="Full screen (F)" aria-label="Full screen" aria-pressed="false">
          <span id="fullIcon" aria-hidden="true">⛶</span>
          <span class="btn-label" id="fullLabel">Full</span>
        </button>
        <button type="button" id="btnHide" class="btn btn-secondary btn-compact" title="Hide controls — tap the page to bring them back (H)" aria-label="Hide controls">
          <span aria-hidden="true">◱</span>
          <span class="btn-label">Hide</span>
        </button>
      </div>
    </header>

    <main id="viewer" class="viewer" tabindex="0" aria-label="Sundar Gutka pages">
      <div id="status" class="status" role="status">Loading Sundar Gutka…</div>
      <div id="pages" class="pages"></div>

      <section id="pager" class="pager" aria-label="Page view" hidden>
        <div class="pager-track" id="pagerTrack">
          <div class="pager-slide" data-slot="prev"><canvas width="0" height="0"></canvas></div>
          <div class="pager-slide" data-slot="cur"><canvas width="0" height="0"></canvas></div>
          <div class="pager-slide" data-slot="next"><canvas width="0" height="0"></canvas></div>
        </div>
        <span class="page-badge pager-badge" id="pagerBadge" aria-hidden="true"></span>
        <div class="pager-progress" id="pagerProgress" aria-hidden="true"></div>
      </section>

      <div id="hint" class="hint" role="status" aria-live="polite" hidden>
        <div class="hint-zones" id="hintZones" aria-hidden="true">
          <div class="hint-zone"><span>▲ Previous</span></div>
          <div class="hint-zone hint-zone-mid"><span>Controls</span></div>
          <div class="hint-zone"><span>▼ Next</span></div>
        </div>
        <div class="hint-text" id="hintText"></div>
      </div>
    </main>
  </div>

  <!-- Banis drawer -->
  <div id="banisBackdrop" class="banis-backdrop" hidden></div>
  <aside id="banisDrawer" class="banis-drawer" aria-hidden="true" aria-label="Banis table of contents" inert>
    <div class="banis-header">
      <h2>Banis</h2>
      <button type="button" id="btnCloseBanis" class="btn btn-secondary btn-icon" title="Close" aria-label="Close banis menu">✕</button>
    </div>
    <div id="banisList" class="banis-list" role="list"></div>
  </aside>

  <script type="module" src="js/app.js?v=11"></script>
</body>
</html>
